firedrill: v0
drill: gcp/no-editor-service-accounts
cases:
    - name: only Google's agent has Editor
      expect: PASS
      target:
        member_domains: []
        name: acme-prod
        number: "123"
      facts:
        bindings:
            - conditional: false
              default_account: false
              google_managed: true
              member: ""
              member_domain: cloudservices.gserviceaccount.com
              member_type: service_account
              role: roles/editor
            - conditional: false
              default_account: false
              google_managed: false
              member: ""
              member_domain: acme-prod.iam.gserviceaccount.com
              member_type: service_account
              role: roles/storage.admin
    - name: default compute account has Editor
      expect: FAIL
      target:
        member_domains: []
        name: acme-prod
        number: "123"
      facts:
        bindings:
            - conditional: false
              default_account: false
              google_managed: false
              member: ""
              member_domain: developer.gserviceaccount.com
              member_type: service_account
              role: roles/editor
    - name: no bindings
      expect: N/A
      target:
        member_domains: []
        name: acme-prod
        number: "123"
      facts:
        bindings: []
