firedrill: v0
drill: change/human-review-required
cases:
    - name: pass
      expect: PASS
      target:
        name: acme/api
        plan: team
        private: true
        protection_available: true
      facts:
        bots:
            can_approve_pull_requests: false
            default_token_permission: read
        rules:
            bypass: none
            bypass_source: api
            code_owner_review: false
            deletion_allowed: false
            dismiss_stale: true
            force_push_allowed: false
            required_approvals: 1
    - name: no approvals
      expect: FAIL
      target:
        name: acme/api
        plan: team
        private: true
        protection_available: true
      facts:
        bots:
            can_approve_pull_requests: false
            default_token_permission: read
        rules:
            bypass: none
            bypass_source: api
            code_owner_review: false
            deletion_allowed: false
            dismiss_stale: false
            force_push_allowed: false
            required_approvals: 0
    - name: free
      expect: N/A
      target:
        name: acme/api
        plan: free
        private: true
        protection_available: false
      facts:
        bots:
            can_approve_pull_requests: false
            default_token_permission: read
        rules:
            bypass: none
            bypass_source: api
            code_owner_review: false
            deletion_allowed: false
            dismiss_stale: false
            force_push_allowed: false
            required_approvals: 0
