firedrill: v0
drill: change/workflow-tokens-read-only
cases:
    - name: pass
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - file: a
                  permissions: read
                  pull_request_target_checkout: false
                  unpinned_actions: []
            inspected: 1
      inspected:
        workflows: 1
    - name: pull request code
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found:
                - file: a
                  permissions: read
                  pull_request_target_checkout: true
                  unpinned_actions: []
            inspected: 1
      inspected:
        workflows: 1
    - name: none
      expect: N/A
      target:
        local: true
        name: acme/api
      facts:
        workflows:
            found: []
            inspected: 0
