firedrill: v0
drill: agent/no-prod-secrets-in-agent-reach
cases:
    - name: clean scan
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found: []
            inspected: 0
            shared_credentials: []
        secrets:
            found: []
            inspected: 5
            shared_prod_staging: []
      inspected:
        secrets: 5
    - name: example only
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found: []
            inspected: 0
            shared_credentials: []
        secrets:
            found:
                - agent_readable: true
                  env_class: example
                  file: fixtures/k
                  hash: h
                  key_id: ""
                  kind: generic
                  line: 1
            inspected: 5
            shared_prod_staging: []
      inspected:
        secrets: 5
    - name: unknown env
      expect: FAIL
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found: []
            inspected: 0
            shared_credentials: []
        secrets:
            found:
                - agent_readable: true
                  env_class: unknown
                  file: scripts/x.sh
                  hash: h
                  key_id: ""
                  kind: generic
                  line: 1
            inspected: 5
            shared_prod_staging: []
      inspected:
        secrets: 5
    - name: denied to agents
      expect: PASS
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found: []
            inspected: 0
            shared_credentials: []
        secrets:
            found:
                - agent_readable: false
                  env_class: prod
                  file: scripts/x.sh
                  hash: h
                  key_id: ""
                  kind: generic
                  line: 1
            inspected: 5
            shared_prod_staging: []
      inspected:
        secrets: 5
    - name: empty
      expect: N/A
      target:
        local: true
        name: acme/api
      facts:
        agents:
            found: []
            inspected: 0
            shared_credentials: []
        secrets:
            found: []
            inspected: 0
            shared_prod_staging: []
